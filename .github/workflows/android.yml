name: Build PetLingo APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        id: setup-java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.10.2"

      - name: Verify environment
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          which java
          java -version
          which gradle
          gradle --version

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk \
             app/build/outputs/apk/debug/PetLingo.apk

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: PetLingo-APK
          path: app/build/outputs/apk/debug/PetLingo.apk
          if-no-files-found: error
          retention-days: 30
